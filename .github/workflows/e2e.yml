name: E2E & API Tests

# Gate every pull request on the full Playwright suite, and also run it on
# pushes to the long-lived branches, on published releases, and on demand.
# Make "E2E Tests" a required status check in branch protection so a PR can
# only merge once this whole workflow is green.
#
# The PHP version the site under test runs on defaults to 7.4 — the floor the
# plugin actually claims (`composer.json` "php": ">=7.4", `Requires PHP: 7.4`).
# Testing the floor is what catches bugs that only surface below 8.1, such as
# static variables in inherited methods becoming shared with the parent scope
# in 8.1; an 8.2-only matrix is blind to them. A manual run can pick any other
# supported version.
on:
  pull_request:
  push:
    branches: [develop, main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version for the site under test'
        type: choice
        default: '7.4'
        options: ['7.4', '8.0', '8.1', '8.2', '8.3']

run-name: E2E & API Tests (PHP ${{ github.event.inputs.php_version || '7.4' }})

# Cancel superseded runs on the same ref/PR to save CI minutes.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege defaults; the report job widens to write checks/PR comments.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Build ONCE, share with every shard.
  #
  # Each shard used to run `composer install` + `npm run build` (~135s) and the
  # Pro build (~25s) on its own runner — the same work four times over. This job
  # does it a single time and publishes the generated output as a tarball the
  # shards unpack over their checkout: composer's vendor/, mozart's generated
  # lib/packages/, every webpack build/ dir, and the fully built Pro plugin.
  #
  # What can NOT be shared is Docker: matrix jobs land on separate runners, so
  # each shard still boots its own wp-env site (that's also what lets them run
  # in parallel at all — see the workers:1 note on the matrix below).
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Told to the shards so they can decide whether to map Pro in and whether to
    # run the @pro-tagged specs, without needing the secret themselves.
    outputs:
      has-pro: ${{ steps.pro.outputs.has-pro }}

    steps:
      # Pro is optional: when this repo secret exists, CI clones + builds Pro and
      # (via LICENSE_KEY in the shards) activates its Appsero license; otherwise
      # the suite runs lite-only and Pro-only tests are filtered out. Resolved to
      # a plain output here because `secrets` can't be used in job-level `if:`.
      - name: Detect Pro access
        id: pro
        env:
          PRO_REPO_TOKEN: ${{ secrets.SG_PRO_TOKEN }}
        run: |
          if [ -n "$PRO_REPO_TOKEN" ]; then
            echo "has-pro=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-pro=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # No npm cache here: lock files are gitignored in this repo, so setup-node
      # has nothing to hash. We cache ~/.npm + node_modules ourselves below.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      # ---- Caches. Lock files are gitignored, so key on the manifests. The
      # restore-keys give a warm partial cache even when a manifest changes. ----
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache npm + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      # --ignore-platform-reqs: the committed composer.lock pins old dev-only
      # packages (e.g. symfony/service-contracts) that cap at PHP <8.0. They're
      # build-time only (mozart prefixes them into lib/packages/), so the
      # platform mismatch is harmless for the runtime autoloader.
      - name: Build plugin (composer + assets)
        run: |
          composer install --no-interaction --prefer-dist --ignore-platform-reqs
          npm install --prefer-offline --no-audit --no-fund
          npm run build

      # ---- StoreGrowth Pro (optional) --------------------------------------
      # Pro ships no built artifacts, so check it out + composer + build it. The
      # checkout path must live under the workspace; that nests Pro inside the
      # lite plugin dir, but WordPress only scans one dir deep so the nested copy
      # is inert — the shards mount the real Pro at the right path via
      # .wp-env.override.json.
      - name: Checkout StoreGrowth Pro
        if: ${{ steps.pro.outputs.has-pro == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: getdokan/storegrowth-sales-booster-pro
          ref: develop
          token: ${{ secrets.SG_PRO_TOKEN }}
          path: storegrowth-sales-booster-pro
          fetch-depth: 1

      - name: Build StoreGrowth Pro
        if: ${{ steps.pro.outputs.has-pro == 'true' }}
        working-directory: storegrowth-sales-booster-pro
        run: |
          composer install --no-interaction --prefer-dist --ignore-platform-reqs
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      # ---- Package what the shards can't regenerate from a plain checkout ----
      # Exactly the gitignored build output: vendor/, mozart's lib/packages/, and
      # every package's webpack build/ dir. `ls -d` drops any path a build didn't
      # produce so a missing one is skipped instead of failing the tar. Pro goes
      # in its own tarball, minus node_modules/.git (neither is needed at
      # runtime, and both dwarf the build output).
      - name: Package build output
        run: |
          mkdir -p "${RUNNER_TEMP}/build-artifacts"
          # shellcheck disable=SC2046  # word splitting is the point: one arg per path
          tar -czf "${RUNNER_TEMP}/build-artifacts/lite-build.tgz" \
            $(ls -d vendor lib/packages assets/build integrations/assets/build modules/*/assets/build 2>/dev/null)
          if [ -d storegrowth-sales-booster-pro ]; then
            tar --exclude='./node_modules' --exclude='./.git' \
              -czf "${RUNNER_TEMP}/build-artifacts/pro-build.tgz" \
              -C storegrowth-sales-booster-pro .
          fi
          ls -lh "${RUNNER_TEMP}/build-artifacts"

      # compression-level 0: the tarballs are already gzipped.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-artifacts
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  playwright:
    name: Playwright (${{ matrix.name }} · PHP ${{ github.event.inputs.php_version || '7.4' }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    # Parallel jobs, each with its OWN wp-env site. The suite can't use multiple
    # workers within one site (the spsg_active_module_ids option has a non-atomic
    # read-modify-write race, ISSUES #2), so parallelism comes from separate
    # sites. The browserless API project gets one dedicated job; the heavier UI
    # project is sharded across three. fail-fast: false so one job's failure
    # doesn't cancel the others (and so the report job sees every shard).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,  cmd: '--project=api' }
          - { name: ui-1, cmd: '--project=ui --shard=1/3' }
          - { name: ui-2, cmd: '--project=ui --shard=2/3' }
          - { name: ui-3, cmd: '--project=ui --shard=3/3' }

    env:
      # wp-env serves the dev site on :8888 with default admin/password creds.
      BASE_URL: http://localhost:8888
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: password
      WP_API_USER: admin
      # Activates Pro's Appsero license during provisioning; empty on lite-only
      # runs, which simply skip license activation. (Keeps its name so
      # provision-site.php's getenv() finds it.)
      LICENSE_KEY: ${{ secrets.SG_LICENSE_KEY }}
      HAS_PRO: ${{ needs.build.outputs.has-pro }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only the Playwright deps are installed here — the plugin build arrives
      # prebuilt from the `build` job, so no composer or root npm install.
      - name: Cache npm + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            tests/e2e/node_modules
          key: ${{ runner.os }}-npm-e2e-${{ hashFiles('tests/e2e/package.json') }}
          restore-keys: ${{ runner.os }}-npm-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # ---- Unpack the shared build over this shard's checkout ----
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-artifacts

      - name: Unpack build output
        run: |
          tar -xzf "${RUNNER_TEMP}/build-artifacts/lite-build.tgz"
          if [ -f "${RUNNER_TEMP}/build-artifacts/pro-build.tgz" ]; then
            mkdir -p storegrowth-sales-booster-pro
            tar -xzf "${RUNNER_TEMP}/build-artifacts/pro-build.tgz" \
              -C storegrowth-sales-booster-pro
          fi

      # .wp-env.override.json is deep-merged over .wp-env.json. Two things go in
      # it, so they are written together rather than by competing steps that
      # would overwrite each other's file: the PHP version under test, and the
      # mapping for the prebuilt Pro plugin. provision-site.php activates Pro +
      # its license later.
      - name: Configure wp-env override (PHP version + Pro mapping)
        working-directory: tests/e2e
        env:
          PHP_VERSION: ${{ github.event.inputs.php_version || '7.4' }}
          PRO_PATH: ${{ github.workspace }}/storegrowth-sales-booster-pro
          HAS_PRO: ${{ needs.build.outputs.has-pro }}
        run: |
          if [ "$HAS_PRO" = "true" ]; then
            jq -n --arg php "$PHP_VERSION" --arg pro "$PRO_PATH" \
              '{phpVersion: $php, mappings: {"wp-content/plugins/storegrowth-sales-booster-pro": $pro}}' \
              > .wp-env.override.json
          else
            jq -n --arg php "$PHP_VERSION" '{phpVersion: $php}' > .wp-env.override.json
          fi
          cat .wp-env.override.json

      # ---- Boot WordPress + WooCommerce + this plugin via wp-env ----
      # .wp-env.json lives in tests/e2e, so wp-env runs from there.
      - name: Start WordPress (wp-env)
        working-directory: tests/e2e
        run: |
          npm -g install @wordpress/env
          wp-env start

      # Prove the site is actually on the requested PHP, so a run labelled
      # "PHP 7.4" can't quietly have tested 8.2.
      - name: Report the site's PHP version
        working-directory: tests/e2e
        run: |
          wp-env run cli wp eval 'echo PHP_VERSION, PHP_EOL;'
          echo "PHP under test: $(wp-env run cli wp eval 'echo PHP_VERSION;' 2>/dev/null | tr -d '\r')" >> "$GITHUB_STEP_SUMMARY"

      # Storefront is a classic theme; the storefront specs assert against its
      # classic WooCommerce markup (.summary / .entry-summary / ul.products).
      # wp-env doesn't activate the themes it installs, and if its bundled block
      # theme stays active WooCommerce serves blockified product/shop templates
      # without that markup. Install + activate Storefront explicitly (mirrors
      # bin/setup-docker.sh) so the suite runs against the intended theme.
      - name: Activate Storefront theme
        working-directory: tests/e2e
        run: wp-env run cli wp theme install storefront --activate

      # Same shared site setup the Docker stack runs: pretty permalinks, publish
      # storefront, activate ALL modules, classic checkout, seed products, and —
      # when LICENSE_KEY is set — activate the Pro Appsero license. LICENSE_KEY is
      # injected into the cli container's shell so provision-site.php's getenv()
      # sees it (empty for lite-only runs, which simply skip license activation).
      - name: Provision the site
        working-directory: tests/e2e
        run: |
          wp-env run cli sh -c \
            "LICENSE_KEY='${LICENSE_KEY}' wp eval-file wp-content/plugins/storegrowth-sales-booster/tests/e2e/bin/provision-site.php"

      # ---- Install test deps + browsers, then run the suite ----
      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm install --prefer-offline --no-audit --no-fund

      # The API project is browserless, so only the UI shards need Chromium.
      - name: Install Playwright browser
        if: ${{ matrix.name != 'api' }}
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # Run @pro-tagged tests only when Pro was actually built + mapped in.
      # Without it, exclude them by tag so they never run against the lite build.
      # The runtime getIsPro() skip inside those tests is a backstop;
      # --grep-invert avoids even spinning them up.
      - name: Run Playwright tests (${{ matrix.name }})
        working-directory: tests/e2e
        run: |
          FILTER=""
          if [ "$HAS_PRO" != "true" ]; then FILTER="--grep-invert @pro"; fi
          # shellcheck disable=SC2086  # $FILTER must split into separate args
          npx playwright test ${{ matrix.cmd }} $FILTER

      # ---- Always publish per-shard artifacts, even on failure ----
      # The blob report is the machine-mergeable form consumed by the `report`
      # job below; the JUnit XML feeds the test-reporter Check. Traces/videos
      # are uploaded only on failure to keep storage lean.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.name }}
          path: tests/e2e/blob-report
          retention-days: 7

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.name }}
          path: tests/e2e/results/junit.xml
          retention-days: 14

      - name: Upload traces & screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: tests/e2e/test-results
          retention-days: 7

  # --------------------------------------------------------------------------
  # Fancy report: merge the sharded blob reports into ONE HTML report, render a
  # rich GitHub Checks report from the JUnit results, and write a summary table
  # to the run's Summary tab. Runs even when shards fail so failures are visible.
  # --------------------------------------------------------------------------
  report:
    name: Test report
    if: ${{ always() && needs.playwright.result != 'skipped' }}
    needs: playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: tests/e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Download JUnit results
        uses: actions/download-artifact@v4
        with:
          path: tests/e2e/all-junit
          pattern: junit-results-*

      # Merge every shard's blob into a single, browsable HTML report.
      - name: Merge into one HTML report
        working-directory: tests/e2e
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      # Rich, per-test pass/fail report rendered as a GitHub Check (shows up in
      # the PR's Checks tab and as inline annotations on failing tests).
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: ${{ always() }}
        with:
          name: Playwright results
          path: 'tests/e2e/all-junit/**/junit.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      # Compact pass/fail/skip totals on the run's Summary tab.
      - name: Write summary
        if: ${{ always() }}
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          time = 0.0
          for f in glob.glob('tests/e2e/all-junit/**/junit.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for ts in root.iter('testsuite'):
                  tests += int(ts.get('tests', 0))
                  failures += int(ts.get('failures', 0))
                  errors += int(ts.get('errors', 0))
                  skipped += int(ts.get('skipped', 0))
                  time += float(ts.get('time', 0) or 0)
          passed = tests - failures - errors - skipped
          ok = failures == 0 and errors == 0
          out = open(sys.argv[1], 'a')
          out.write('## Playwright E2E & API results\n\n')
          out.write(f"{'✅ All tests passed' if ok else '❌ Tests failed'}\n\n")
          out.write('| Result | Count |\n|---|---|\n')
          out.write(f'| ✅ Passed | {passed} |\n')
          out.write(f'| ❌ Failed | {failures} |\n')
          out.write(f'| 💥 Errors | {errors} |\n')
          out.write(f'| ⏭️ Skipped | {skipped} |\n')
          out.write(f'| 📊 Total | {tests} |\n')
          out.write(f'| ⏱️ Duration | {time:.1f}s |\n\n')
          out.write('Download the **playwright-report** artifact for the full HTML report.\n')
          out.close()
          PY

  # --------------------------------------------------------------------------
  # Single, stable required check for branch protection. Because the matrix job
  # names contain the shard (and can change), protecting them directly is
  # brittle — protect THIS job instead. It fails if the build failed or if any
  # shard failed/was cancelled, so "all green here" == "safe to merge".
  # --------------------------------------------------------------------------
  e2e-status:
    name: E2E Tests
    if: ${{ always() }}
    needs: [build, playwright]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the build and every shard succeeded
        run: |
          echo "build result:              ${{ needs.build.result }}"
          echo "playwright matrix result:  ${{ needs.playwright.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::The shared build job failed or was cancelled."
            exit 1
          fi
          if [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "::error::One or more Playwright shards failed or were cancelled."
            exit 1
          fi
          echo "All Playwright shards passed."
