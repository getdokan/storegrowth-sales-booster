name: PHPCS Inspections

on: pull_request

# Cancel superseded runs for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  runPHPCSInspection:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR base branch is reachable for the diff.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress || composer update --prefer-dist --no-progress

      # phpcs-changed reports only the violations on lines this PR actually
      # changed, so pre-existing legacy violations in touched files don't fail
      # CI. Installed globally to avoid touching the repo's composer.lock.
      - name: Install phpcs-changed
        run: |
          composer global require sirbrillig/phpcs-changed --no-interaction --no-progress
          echo "$(composer global config bin-dir --absolute -q)" >> "$GITHUB_PATH"

      - name: Collect changed PHP files
        id: changes
        run: |
          URL="https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
          # The files endpoint paginates at 30 by default (100 max), so walk every
          # page — otherwise changed files past the first page escape phpcs-changed.
          NAMES=""
          page=1
          while :; do
            RESP=$(curl --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' -s -G "$URL" \
              --data-urlencode "per_page=100" --data-urlencode "page=$page")
            COUNT=$(echo "$RESP" | jq 'length')
            [ "$COUNT" = "0" ] && break
            NAMES="$NAMES"$'\n'"$(echo "$RESP" | jq -r '.[] | select(.status != "removed") | .filename')"
            [ "$COUNT" -lt 100 ] && break
            page=$((page + 1))
          done
          FILES=$(echo "$NAMES" \
            | grep -E '\.php$' \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done \
            | xargs)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      # Diff against the PR base, reporting only newly introduced violations.
      - name: Detect coding standard violations on changed lines
        if: steps.changes.outputs.files != ''
        run: |
          git fetch --no-tags origin \
            "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          phpcs-changed \
            --git --git-base "origin/${{ github.base_ref }}" \
            --phpcs-path vendor/bin/phpcs \
            ${{ steps.changes.outputs.files }}
