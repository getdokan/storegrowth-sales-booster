name: PHPUnit Tests

# Characterisation tests for offer eligibility and the BOGO data layer.
#
# WordPress + WooCommerce come from wp-env, the same way the E2E workflow boots
# its site, so both suites run against one description of the environment
# (`.wp-env.json`) instead of two hand-rolled setups that can drift apart.
#
# The suite runs inside the `tests-cli` container, never `cli`: wp-env exports
# WP_TESTS_DIR=/wordpress-phpunit there and points it at the disposable
# `tests-wordpress` database. WordPress' test bootstrap drops and recreates every
# table it owns, which would destroy the development site the `cli` container
# serves.
#
# PHP 7.4 matches the default of the E2E workflow, so a behaviour difference
# between the two suites is never just a PHP version difference.

on:
  push:
    branches: [ develop, trunk ]
  pull_request:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version'
        required: false
        default: '7.4'

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ github.event.inputs.php_version || '7.4' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6

      # Composer runs on the host, and `.wp-env.json` mounts this checkout —
      # vendor/ included — into the container as the plugin. So the host PHP has
      # to match the container's, or the autoloader and phpunit binary are built
      # against the wrong version. `composer.json` also pins platform php to 7.4.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ github.event.inputs.php_version || '7.4' }}
          extensions: mysqli, zip, gd
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # ---- StoreGrowth Pro (optional) ----------------------------------------
      # Campaigns are Pro's; their tests live in Pro and run on this plugin's
      # test bootstrap. With the Pro token, check out Pro's branch of the same
      # name (else develop) next to this plugin and run its suite too.
      - name: Detect Pro access
        id: pro
        env:
          PRO_REPO_TOKEN: ${{ secrets.SG_PRO_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$PRO_REPO_TOKEN" ]; then
            echo "has-pro=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref=develop
          if git ls-remote --exit-code --heads "https://x-access-token:${PRO_REPO_TOKEN}@github.com/getdokan/storegrowth-sales-booster-pro.git" "$BRANCH" >/dev/null 2>&1; then
            ref="$BRANCH"
          fi
          echo "has-pro=true" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "StoreGrowth Pro ref: $ref"

      - name: Checkout StoreGrowth Pro
        if: ${{ steps.pro.outputs.has-pro == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: getdokan/storegrowth-sales-booster-pro
          ref: ${{ steps.pro.outputs.ref }}
          token: ${{ secrets.SG_PRO_TOKEN }}
          path: storegrowth-sales-booster-pro
          fetch-depth: 1

      - name: Install StoreGrowth Pro dependencies
        if: ${{ steps.pro.outputs.has-pro == 'true' }}
        working-directory: storegrowth-sales-booster-pro
        run: composer install --prefer-dist --no-progress --no-interaction

      # .wp-env.override.json is deep-merged over .wp-env.json, so a manual run
      # can test another PHP without editing the committed config. With Pro it
      # also maps Pro next to this plugin, where its test bootstrap looks.
      - name: Configure wp-env override (PHP version + Pro mapping)
        env:
          PHP_VERSION: ${{ github.event.inputs.php_version || '7.4' }}
          HAS_PRO: ${{ steps.pro.outputs.has-pro }}
        run: |
          if [ "$HAS_PRO" = "true" ]; then
            jq -n --arg php "$PHP_VERSION" --arg pro "./storegrowth-sales-booster-pro" \
              '{phpVersion: $php, mappings: {"wp-content/plugins/storegrowth-sales-booster-pro": $pro}}' \
              > .wp-env.override.json
          else
            jq -n --arg php "$PHP_VERSION" '{phpVersion: $php}' > .wp-env.override.json
          fi
          cat .wp-env.override.json

      - name: Start WordPress (wp-env)
        run: |
          npm -g install @wordpress/env
          wp-env start

      # Prove the container really is on the requested PHP, so a run labelled
      # "PHP 7.4" can't quietly have tested something else.
      - name: Report the PHP version under test
        run: |
          wp-env run tests-cli php -v
          echo "PHP under test: $(wp-env run tests-cli php -r 'echo PHP_VERSION;' 2>/dev/null | tr -d '\r')" >> "$GITHUB_STEP_SUMMARY"

      - name: Run PHPUnit
        run: wp-env run tests-cli --env-cwd=wp-content/plugins/storegrowth-sales-booster vendor/bin/phpunit -c phpunit.xml

      - name: Run StoreGrowth Pro's PHPUnit (campaigns)
        if: ${{ steps.pro.outputs.has-pro == 'true' }}
        run: wp-env run tests-cli --env-cwd=wp-content/plugins/storegrowth-sales-booster-pro ../storegrowth-sales-booster/vendor/bin/phpunit -c phpunit.xml

      # A failed boot says nothing useful on its own; the container logs do.
      - name: Container logs on failure
        if: failure()
        run: wp-env logs tests --watch=false
