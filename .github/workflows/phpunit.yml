name: PHPUnit Tests

# Characterisation tests for offer eligibility and the BOGO data layer.
#
# PHP 7.4 matches the default of the E2E workflow, so a behaviour difference
# between the two suites is never just a PHP version difference. The suite boots
# a real WordPress + WooCommerce through wp-phpunit, so the job lays the
# workspace out the way a WordPress install expects: core at the root, the
# plugin and WooCommerce under wp-content/plugins.

on:
  push:
    branches: [ develop, trunk ]
  pull_request:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version'
        required: false
        default: '7.4'

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ github.event.inputs.php_version || '7.4' }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: spsg_phpunit_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_NAME: spsg_phpunit_tests
      WP_DB_USER: root
      WP_DB_PASS: ''
      WP_DB_HOST: 127.0.0.1

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: wp-content/plugins/storegrowth-sales-booster

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ github.event.inputs.php_version || '7.4' }}
          extensions: mysqli, zip, gd
          tools: composer:v2
          coverage: none

      # WordPress core at the workspace root and WooCommerce beside the plugin:
      # tests/php/bootstrap.php resolves WooCommerce as a sibling plugin
      # directory, and phpunit-wp-config.php walks up to the workspace root for
      # ABSPATH.
      - name: Download WordPress core
        run: |
          curl -sSL https://wordpress.org/latest.tar.gz -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp
          cp -r /tmp/wordpress/. "$GITHUB_WORKSPACE/"

      - name: Download WooCommerce
        run: |
          curl -sSL https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o /tmp/wc.zip
          unzip -q /tmp/wc.zip -d "$GITHUB_WORKSPACE/wp-content/plugins/"

      - name: Get composer cache directory
        id: composercache
        working-directory: wp-content/plugins/storegrowth-sales-booster
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: wp-content/plugins/storegrowth-sales-booster
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root --silent && break
            sleep 2
          done

      - name: Run PHPUnit
        working-directory: wp-content/plugins/storegrowth-sales-booster
        run: vendor/bin/phpunit -c phpunit.xml
